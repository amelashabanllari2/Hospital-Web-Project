<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Hospital - My appointments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏥 Health Hospital</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="doctors.html">Doctors</a>
            <a href="tests.html">Tests</a>
            <a href="products.html">Herbal products</a>
            <a href="appointments.html">My appointments</a>
            <a href="info.html">Info</a>
        </nav>
    </header>

    <main>
        <h2>My appointments</h2>

        <!-- WARNING AT THE TOP (appears when you press Cancel) -->
        <div id="warningBox" class="warning-bar hidden">
            <span id="warningText"></span>
            <span class="warning-buttons">
                <button type="button" id="yesBtn" class="danger">Yes, cancel</button>
                <button type="button" id="noBtn" class="light">No, keep it</button>
            </span>
        </div>
        <p class="success" id="messageBox"></p>

        <div class="box filters">
            <div>
                <label for="statusFilter">Show</label>
                <select id="statusFilter">
                    <option value="all">All</option>
                    <option value="Active">Active</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
            <div>
                <label for="typeFilter">Type</label>
                <select id="typeFilter">
                    <option value="all">All</option>
                    <option value="Appointment">Doctor appointments</option>
                    <option value="Tests">Tests</option>
                    <option value="Order">Herbal products orders</option>
                </select>
            </div>
        </div>

        <p id="countText"></p>
        <div id="appointmentList" class="grid"></div>
    </main>

    <footer>
        <p>© 2026 Health Hospital | Tel: +355 69 123 4567</p>
    </footer>

    <script src="common.js"></script>
    <script src="appointments.js"></script>
</body>
</html>
